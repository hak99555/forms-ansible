[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-tenancy-toolkit"
version = "0.1.0"
description = "Terraform inventories and read-only administration reports for OCI Identity Domains, ADB, OIC and buckets"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["oci>=2.160,<3"]

[project.scripts]
oci-admin = "oci_admin.cli:main"

[tool.setuptools.packages.find]
include = ["oci_admin*"]
